name: miyaris

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: miyaris
      POSTGRES_PASSWORD: miyaris
      POSTGRES_DB: miyaris_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miyaris -d miyaris_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend:/app

volumes:
  postgres_data:
