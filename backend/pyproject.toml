[project]
name = "miyaris-backend"
version = "0.1.0"
description = "Miyaris — luxury watch auction platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    # psycopg2-binary: alembic offline mode veya beklenmedik sync fallback
    # senaryoları için emniyet. Runtime'da hala asyncpg kullanırız.
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "bcrypt>=4.0,<5.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.2.0",
    "python-slugify>=8.0.4",
    # Resend — transaktif e-posta (doğrulama + welcome maili). Resend Python SDK
    # 0.7.x stable; HTTP API üzerinden tek dependency, requests'i çeker.
    "resend>=0.7.0",
    # slowapi — rate limiting middleware (login/register brute force
    # koruması). In-memory storage default; multi-replica'ya geçince
    # Redis URL ile pluggable.
    "slowapi>=0.1.9,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
