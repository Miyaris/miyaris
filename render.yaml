# ============================================================================
# Miyaris — Render.com Infrastructure as Code
# Tek tık deployment için "Blueprint" — Render dashboard → "New Blueprint
# Instance" sekmesinde bu repo'yu seç, Render otomatik olarak:
#   - PostgreSQL veritabanı oluşturur
#   - Backend Web Service (FastAPI) ayağa kaldırır
#   - AI Worker Background Worker ayağa kaldırır
# Tüm bağlantı ayarları otomatik enjekte edilir (DATABASE_URL, JWT secret,
# SERVICE_API_KEY paylaşımı).
# ============================================================================

databases:
  - name: miyaris-postgres
    plan: free          # Production'da en az `starter` (kalıcı backup) yükselt
    databaseName: miyaris_db
    user: miyaris
    postgresMajorVersion: 16

services:
  # ----- Backend: FastAPI Web Service ------------------------------------
  - type: web
    name: miyaris-backend
    runtime: docker
    plan: starter        # Free de çalışır; starter request log + uptime sağlar
    region: frankfurt    # TR'ye en yakın region — DB ile aynı region OLMALI
                         # (Internal URL aynı region'da çalışır)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true     # main branch push → otomatik deploy
    # NOT: preDeployCommand kullanmıyoruz. Render preDeploy ephemeral
    # container'ında WORKDIR/ENV taşıması güvenilmez ve sessiz exit 128
    # alabiliyor. Bunun yerine wait_for_db + alembic + uvicorn zinciri
    # Docker CMD'de single-process olarak çalışıyor — daha az hareketli
    # parça, log her zaman görünür.
    envVars:
      # ---- DB & Cache ----
      - key: DATABASE_URL
        fromDatabase:
          name: miyaris-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false      # Henüz kullanılmıyor; ileride manuel set'lenebilir
      # ---- JWT — RS256 asimetrik imza (Zero Trust upgrade) ----
      # Private + Public PEM çiftleri Render dashboard'da MANUEL set'lenir
      # (sync: false). Üretim için openssl ile oluştur:
      #   openssl genpkey -algorithm RSA -out priv.pem -pkeyopt rsa_keygen_bits:2048
      #   openssl rsa -pubout -in priv.pem -out pub.pem
      # Sonra dosyaların İÇERİĞİNİ tek tek paste'le. Render multiline secret'ı
      # düzgün saklıyor; literal \n ile gelen değerleri kodda normalize ediyoruz.
      - key: JWT_PRIVATE_KEY_PEM
        sync: false
      - key: JWT_PUBLIC_KEY_PEM
        sync: false
      # Legacy HS256 secret — grace period (7 gün) için dual-verify modunda.
      # Mevcut JWT_SECRET_KEY'i koruyoruz; süre sonunda silinecek.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_LEGACY_HS256_VERIFY
        value: "true"  # Grace period sonu: false yap, JWT_SECRET_KEY'i sil
      # ---- Servisler arası anahtar (worker ile paylaşılır — aşağıda aynısı) ----
      - key: SERVICE_API_KEY
        generateValue: true
      # ---- Rate limiting ----
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # Güvenilen reverse proxy sayısı (X-Forwarded-For). Render edge tek
      # katman olduğu için 1 doğru. ÖNÜNE Cloudflare gibi ek bir proxy
      # koyarsan 2 yap — aksi halde rate-limit/audit IP'si yanlış (spoof'a
      # açık) okunur. Bkz. app/core/middleware.py:client_ip.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # ---- Uygulama ayarları ----
      - key: APP_NAME
        value: miyaris
      - key: APP_ENV
        value: "production"  # Boot fail-fast'leri ve sıkı CORS bunu okur
      - key: DEBUG
        value: "false"
      - key: JWT_ALGORITHM
        value: RS256
      # 30 dk access token + 30 gün refresh (rotation aktif → güvenli).
      # Frontend sessiz refresh akışı devreye girince 15 dk'ya çekilebilir;
      # şimdilik 30 dk → kullanıcı arka arkaya logout görmez.
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      # ---- NVİ — production'da aktif et ----
      - key: NVI_VERIFICATION_ENABLED
        value: "false"   # Vercel canlıya çıkınca dashboard'dan true yap
      - key: NVI_TIMEOUT_SECONDS
        value: "10"
      # ---- Kapora (deposit) ödeme akışı ----
      # iyzico/PayTR entegrasyonu HENÜZ YOK; pay_deposit parayı tahsil
      # etmeden sadece "ödendi" işaretliyor (mock). Bu yüzden production'da
      # VARSAYILAN KAPALI: false iken kapora endpoint'i 503 döner, kimse
      # 0 TL ile teklif hakkı kazanamaz (1000 TL anti-troll koruması korunur).
      #
      # Demo/launch için mock'u bilinçli olarak canlı tutmak istersen "true"
      # yap — ama o zaman herkesin bedava teklif verebileceğini kabul etmiş
      # olursun. Gerçek POS bağlanınca bu env + koddaki gate kaldırılır.
      - key: DEPOSIT_MOCK_ENABLED
        value: "false"
      # ---- CORS — APP_ENV=production iken main.py default'u www+apex miyaris.com
      # Bu env override edilirse (örn staging subdomain), buraya JSON list
      # olarak yaz: '["https://staging.miyaris.com"]'. Boş veya default
      # ["http://localhost:3000"] kalırsa prod fallback devreye girer.
      - key: CORS_ORIGINS
        sync: false
      # ---- Scheduler — tek instance'ta açık, ölçeklenirken sadece bir tanesi 1 olmalı ----
      - key: RUN_SCHEDULER
        value: "1"
      # ---- Resend (transaktif e-posta) ----
      # RESEND_API_KEY: dashboard'da manuel set (zaten Render env'inde). render.yaml'a
      # sync: false ile yer açıyoruz ki Blueprint bunu yönetsin, key'in kendisi
      # repo'ya sızmasın.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Miyaris <noreply@miyaris.com>"
      # Doğrulama linki bu URL'in altına /verify-email?token=... şeklinde yapışır.
      - key: FRONTEND_URL
        value: "https://www.miyaris.com"
      - key: EMAIL_VERIFY_EXPIRE_HOURS
        value: "24"
      # ---- Seed admin'ler ----
      # Virgülle ayrılmış e-posta listesi. Container her açıldığında, bu
      # listedeki kayıtlı kullanıcılar otomatik olarak `role=admin` olur ve
      # `is_verified=True` işaretlenir. Önce normal /register akışıyla
      # hesap aç, sonra Render dashboard'da bu env'e e-postanı ekle ve
      # "Manual Deploy → Clear cache & deploy" tıkla. Container yeniden
      # açıldığında admin rolü atanır.
      # Format: "admin1@miyaris.com,admin2@miyaris.com"
      - key: ADMIN_EMAILS
        sync: false
      # ---- Python ----
      - key: PYTHON_VERSION
        value: "3.11"

  # ----- AI Worker: Background Worker (port dinlemez) --------------------
  - type: worker
    name: miyaris-ai-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./ai-worker/Dockerfile
    dockerContext: ./ai-worker
    autoDeploy: true
    envVars:
      # ---- Backend URL — manuel set (Render `host` property protokol vermiyor) ----
      # İlk deploy sonrası dashboard'da bu env'i şu formatta gir:
      #   https://miyaris-backend.onrender.com
      - key: MIYARIS_API_URL
        sync: false
      - key: SERVICE_API_KEY
        fromService:
          type: web
          name: miyaris-backend
          envVarKey: SERVICE_API_KEY
      # ---- Worker davranış ayarları ----
      - key: POLL_INTERVAL_SECONDS
        value: "15"
      - key: BATCH_SIZE
        value: "5"
      - key: HTTP_TIMEOUT_SECONDS
        value: "30"
      # ---- LLM — Ollama yoksa StubLLM kullanılır (deterministik mock) ----
      - key: OLLAMA_BASE_URL
        sync: false      # Manuel set; boş bırakırsan StubLLM aktif olur
      - key: OLLAMA_MODEL
        value: "llama3.1:8b"
      - key: PYTHON_VERSION
        value: "3.11"
